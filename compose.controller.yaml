services:
  web:
    user: "${LOCAL_UID:?Run deploy/start-production.sh}:0"

  controller:
    build:
      context: .
      dockerfile: deploy/Dockerfile.controller
    restart: unless-stopped
    user: "${LOCAL_UID:?Run deploy/start-production.sh}:0"
    environment:
      DATABASE_PATH: /data/vpn.sqlite3
      XRAY_CONFIG: /xray/xray.json
      XRAY_CONTAINER: ${XRAY_CONTAINER:-shadowrocket_vless}
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - console_data:/data
      - type: bind
        source: ${XRAY_CONFIG_DIR:?Run deploy/start-production.sh}
        target: /xray
        bind:
          create_host_path: false
      - type: bind
        source: ${DOCKER_SOCKET:?Run deploy/start-production.sh}
        target: /var/run/docker.sock
        bind:
          create_host_path: false
    depends_on:
      web:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
